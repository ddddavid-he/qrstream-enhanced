<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>QRStream Decoder</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #151a23;
      --border: #262d3a;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #4f8cff;
      --accent-2: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
    }
    #app {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header h1 {
      font-size: 1.25rem;
      margin: 0;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    #video-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      aspect-ratio: 4 / 3;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #scan-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, transparent 24%, rgba(79,140,255,.25) 24%, rgba(79,140,255,.25) 26%, transparent 26%),
        linear-gradient(to right, transparent 74%, rgba(79,140,255,.25) 74%, rgba(79,140,255,.25) 76%, transparent 76%),
        linear-gradient(to bottom, transparent 24%, rgba(79,140,255,.25) 24%, rgba(79,140,255,.25) 26%, transparent 26%),
        linear-gradient(to bottom, transparent 74%, rgba(79,140,255,.25) 74%, rgba(79,140,255,.25) 76%, transparent 76%);
    }
    #status {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    #error-box {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.4);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
    }
    #progress-bar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .2s ease;
    }
    #stats {
      color: var(--muted);
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }
    #done-panel {
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.4);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #done-info { font-size: 0.9rem; }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    #download-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>QRStream Decoder</h1>
      <p>Point your camera at a QRStream display — files decode in real time.</p>
    </header>

    <div id="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div id="scan-overlay"></div>
    </div>

    <div id="status">Initializing…</div>
    <div id="error-box" class="hidden" role="alert"></div>

    <div id="progress-bar" class="hidden"><div id="progress-fill"></div></div>
    <div id="stats" class="hidden"></div>

    <div id="done-panel" class="hidden">
      <span id="done-info"></span>
      <button id="download-btn">Download</button>
    </div>

    <div>
      <button id="reset-btn">Reset session</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
