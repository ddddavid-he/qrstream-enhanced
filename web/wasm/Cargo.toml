[package]
name = "qrstream-decode"
version = "0.1.0"
edition = "2021"
description = "QRStream V4 (RaptorQ) real-time decoder core for WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raptorq = "2"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
base64 = "0.22"
