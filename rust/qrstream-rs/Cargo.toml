[package]
name = "qrstream-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "qrstream_rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.22"
crc32fast = "1.4"
pyo3 = { version = "0.27", optional = true }
flate2 = "1.0"
raptorq = "2.0.1"
thiserror = "2.0"
uniffi = { version = "0.29", features = ["cli"] }

[features]
default = []
python = ["pyo3", "pyo3/extension-module"]

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
