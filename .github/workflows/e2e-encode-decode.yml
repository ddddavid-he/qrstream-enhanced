name: e2e-encode-decode

# End-to-end pipeline tests: synthetic file → encode_to_video →
# extract_qr_from_video → decode_blocks_to_file → SHA256 verify.
#
# Why this is separate from test.yml
# ------------------------------------
# The unit-test matrix in test.yml bypasses QR image generation
# entirely (LTEncoder / LTDecoder are called directly).  This meant
# that the qrcode 8.x glog(0) crash was never caught before a release:
# the crash only surfaced when encode_to_video was called with a file
# whose compressed payload size fell near the QR-version capacity
# boundary.
#
# These tests close that gap.  They are kept in a separate workflow
# (rather than added to test.yml) because:
#
#   * Each test encodes a real MP4 and decodes it with WeChatQRCode —
#     adding this to the 2-os × 4-python-version matrix in test.yml
#     would multiply CI time for coverage we only need once per
#     architecture.
#   * The e2e suite is architecture-sensitive (QR detection depends on
#     OpenCV / WeChatQRCode native libs), so we run on both amd64 and
#     arm64 — but only against the latest Python to keep cost down.
#
# Trigger policy
# --------------
# Run on pushes to main/dev, PRs targeting main/dev, and when release
# workflows call this file as a reusable gate.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/qrstream/**'
      - 'tests/test_e2e_encode_decode.py'
      - 'tests/test_qr_generate.py'
      - '.github/workflows/e2e-encode-decode.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/qrstream/**'
      - 'tests/test_e2e_encode_decode.py'
      - 'tests/test_qr_generate.py'
      - '.github/workflows/e2e-encode-decode.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-dev-gate:
    if: |
      !(
        github.event_name == 'push' &&
        startsWith(github.event.head_commit.message || '', 'skip-ci:')
      ) &&
      !(
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message || '', 'skip-main-ci:')
      )
    runs-on: ubuntu-latest
    outputs:
      skip-e2e: ${{ steps.query.outputs.skip-e2e }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check matching dev gate
        id: query
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          SKIP="false"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            DEV_SHA=$(git rev-parse "$SHA^2" 2>/dev/null || git rev-parse "$SHA" 2>/dev/null)
            if [ -n "$DEV_SHA" ]; then
              MAIN_TREE=$(git rev-parse "$SHA^{tree}" 2>/dev/null)
              DEV_TREE=$(git rev-parse "$DEV_SHA^{tree}" 2>/dev/null)
              if [ "$MAIN_TREE" = "$DEV_TREE" ]; then
                RESULT=$(gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "e2e-encode-decode.yml" \
                  --branch dev \
                  --commit "$DEV_SHA" \
                  --status success \
                  --limit 1 \
                  --json databaseId 2>/dev/null)
                if [ $? -eq 0 ] && [ "$(echo "$RESULT" | jq 'length' 2>/dev/null)" -gt 0 ]; then
                  echo "::notice::dev e2e gate already passed for $DEV_SHA; skipping duplicated main e2e run."
                  SKIP="true"
                fi
              fi
            fi
          fi

          echo "skip-e2e=$SKIP" >> "$GITHUB_OUTPUT"

  e2e:
    needs: check-dev-gate
    if: needs.check-dev-gate.outputs.skip-e2e != 'true'
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # x86_64 / amd64
          - ubuntu-24.04-arm    # aarch64 / arm64
          - macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Pin to latest stable; e2e correctness doesn't vary by
          # Python minor version (that's covered by test.yml).
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run e2e encode/decode tests
        # -m e2e opts into the marker excluded from the default run.
        # --timeout is not available without pytest-timeout; we rely on
        # the GitHub Actions job-level timeout (below) instead.
        # Exclude the large-file Z=2 test here — it runs in a dedicated
        # single-platform job below to avoid wasting CI resources.
        run: uv run pytest -m e2e -v tests/test_e2e_encode_decode.py --deselect tests/test_e2e_encode_decode.py::TestE2ELargeFileMultiSourceBlock

      - name: Run QR generation regression tests
        # Also run the QR-generation unit tests here so glog(0) and
        # image-property checks are verified on real OpenCV/segno builds.
        run: uv run pytest -v tests/test_qr_generate.py

    # Each test encodes up to ~500 KB of data (~1000 frames at 10 fps ≈
    # 100 s encode).  The full suite is 9 test cases; 20 minutes is a
    # generous ceiling that will catch genuine hangs without false
    # timeouts on slow arm64 runners.
    timeout-minutes: 20

  # ── Large-file Z=2 multi-source-block stress test ───────────────
  #
  # 20MB file with QR v15 → K=56,528, Z=2 source blocks, ~62K frames.
  # Runs on a single platform only to keep CI cost manageable (~8-12 min).
  # Only runs on main (push/PR/release gate) — too expensive for every
  # dev push.  Ignores the dev-gate skip since this test never runs on
  # dev in the first place.
  e2e-large-file:
    needs: check-dev-gate
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_call') &&
      !(
        github.event_name == 'push' &&
        startsWith(github.event.head_commit.message || '', 'skip-ci:')
      )
    name: e2e-large-file (20MB Z=2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run 20MB multi-source-block E2E test
        run: uv run pytest -m e2e -v tests/test_e2e_encode_decode.py::TestE2ELargeFileMultiSourceBlock

    # 20MB → ~62K frames; encode + decode takes ~8-12 min on standard
    # runners.  40 minutes accommodates slow CI without false timeouts.
    timeout-minutes: 40
