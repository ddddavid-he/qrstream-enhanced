name: deploy-pages

# Pages itself is intentionally not enabled by this workflow. After this file
# reaches main, select "GitHub Actions" in Settings -> Pages, then re-run this
# workflow if the merge-triggered run started before Pages was enabled.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install web dependencies
        run: npm ci

      - name: Build decoder WebAssembly
        run: npm run build:wasm

      - name: Type-check web application
        run: npm run typecheck

      - name: Run WebAssembly smoke tests
        run: npm run test:wasm

      - name: Build GitHub Pages site
        env:
          QRSTREAM_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
