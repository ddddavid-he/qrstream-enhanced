name: real-world-tests

# End-to-end smoke layer: decode the real phone-recorded QR videos
# in ``tests/fixtures/`` and verify byte-exact recovery of the
# source files.
#
# Why this is a separate workflow from ``test.yml``:
#   * Each case takes multiple seconds (OpenCV + WeChatQRCode
#     actually walking frames of a real capture), so running it in
#     the per-(os × python-version) unit-test matrix would multiply
#     CI time for coverage we don't need — these tests exercise
#     OpenCV, not Python-version-specific code.
#   * Splitting it out keeps unit tests fast while still letting
#     dev/main pushes and release gates exercise the real recordings.
#
# All committed real-phone fixture cases are gating: any failure
# fails this job.  Historical marginal captures were removed once
# focused unit regressions covered their failure modes.

on:
  push:
    branches:
      - main
      - dev
    paths:
      # Only re-run when something that could actually affect the
      # end-to-end decode path changes.
      - 'src/qrstream/**'
      - 'tests/test_real_recordings.py'
      - 'tests/test_real_recordings_layered.py'
      - 'tests/fixtures/**'
      - '.github/workflows/real-world-tests.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/qrstream/**'
      - 'tests/test_real_recordings.py'
      - 'tests/test_real_recordings_layered.py'
      - 'tests/fixtures/**'
      - '.github/workflows/real-world-tests.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Mondays 06:00 UTC: catch silent upstream regressions
    # (OpenCV / opencv-contrib / ffmpeg build matrices change
    # over time even without our code moving).
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-world-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-dev-gate:
    if: |
      !(
        github.event_name == 'push' &&
        startsWith(github.event.head_commit.message || '', 'skip-ci:')
      ) &&
      !(
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message || '', 'skip-main-ci:')
      )
    runs-on: ubuntu-latest
    outputs:
      os-matrix: ${{ steps.query.outputs.os-matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check matching dev gate
        id: query
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          DEV_PASSED="false"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            DEV_SHA=$(git rev-parse "$SHA^2" 2>/dev/null || git rev-parse "$SHA" 2>/dev/null)
            if [ -n "$DEV_SHA" ]; then
              MAIN_TREE=$(git rev-parse "$SHA^{tree}" 2>/dev/null)
              DEV_TREE=$(git rev-parse "$DEV_SHA^{tree}" 2>/dev/null)
              if [ "$MAIN_TREE" = "$DEV_TREE" ]; then
                RESULT=$(gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "real-world-tests.yml" \
                  --branch dev \
                  --commit "$DEV_SHA" \
                  --status success \
                  --limit 1 \
                  --json databaseId 2>/dev/null)
                if [ $? -eq 0 ] && [ "$(echo "$RESULT" | jq 'length' 2>/dev/null)" -gt 0 ]; then
                  echo "::notice::dev real-world gate already passed for $DEV_SHA; main will run only macOS coverage."
                  DEV_PASSED="true"
                fi
              fi
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_call" ] || [ "$REF_NAME" = "refs/heads/main" ] || [ "$BASE_REF" = "main" ]; then
            OS_MATRIX='["ubuntu-latest","ubuntu-24.04-arm","macos-latest"]'
            if [ "$DEV_PASSED" = "true" ]; then
              OS_MATRIX='["macos-latest"]'
            fi
          else
            OS_MATRIX='["ubuntu-latest","ubuntu-24.04-arm"]'
          fi

          echo "os-matrix=$OS_MATRIX" >> "$GITHUB_OUTPUT"

  real-world:
    needs: check-dev-gate
    name: real-world (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.check-dev-gate.outputs.os-matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run end-to-end phone-recording tests
        # Intentionally run only the real-phone fixture suites that gate
        # releases. Other ``@pytest.mark.slow`` tests (for example the
        # decoder↔sandbox wiring checks) are useful diagnostics but are
        # not part of the release gate, and one of them deliberately runs
        # unsafe in-process detection that can abort on arm64 phone-capture
        # frames before pytest can report a normal failure.
        run: >-
          uv run pytest -m slow -v
          tests/test_real_recordings.py
          tests/test_real_recordings_layered.py
